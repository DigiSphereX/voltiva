name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for Qt (offscreen) and OCR
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
          tesseract-ocr tesseract-ocr-ara
      - run: pip install -r requirements-dev.txt
      - name: Static checks (style sheet + colour contrast)
        run: |
          python scripts/lint_qss.py
          python scripts/check_contrast.py
      - name: Test suite
        run: python -m pytest -q
